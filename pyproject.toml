[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploywarden"
version = "0.1.0"
description = "Audited release automation and rollback CLI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "prometheus-client>=0.20,<1.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[project.scripts]
deploywarden = "deploywarden.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["deploywarden*"]
